<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <title>AI 导航 - 精选人工智能工具与资源</title>
    <meta name="author" content="jsnjfz">
    <meta name="keywords" content="AI导航,人工智能工具,AI助手,AI搜索,AI绘画,AI视频,AI编程,大模型,智能体,AI学习">
    <meta name="description" content="精选人工智能工具与资源导航，覆盖 AI 助手、搜索研究、图像视频、音频创作、编程开发、模型 API、智能体、办公分析与学习资源。">

    <link rel="shortcut icon" href="/static/favicon.ico">

    <!-- 防止深色模式首屏闪白：必须内联且早于样式表生效，逻辑与 nav.js 保持一致 -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem('nav-theme');
                if (t !== 'dark' && t !== 'light') {
                    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
                }
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>

    <!-- ?v= 为构建时间戳（application.yml 的 app.asset-version，由 Maven 注入）。
         静态资源带 1 天 Cache-Control 且文件名无内容哈希，没有这个版本号的话
         发版后浏览器会继续用缓存里的旧 css/js。 -->
    <link rel="stylesheet" href="/static/css/app.css?v=${env('app.asset-version','dev')}">
    <!-- 前台导航页样式覆盖层，必须排在 app.css 之后 -->
    <link rel="stylesheet" href="/static/css/nav.css?v=${env('app.asset-version','dev')}">

    <!-- 搜索/主题/平滑滚动，纯原生 JS，defer 不阻塞渲染 -->
    <script src="/static/js/nav.js?v=${env('app.asset-version','dev')}" defer></script>
</head>

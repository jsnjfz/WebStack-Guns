<div class="sidebar-menu toggle-others fixed">
    <div class="sidebar-menu-inner">
        <header class="logo-env">
            <!-- logo -->
            <div class="logo">
                <a href="/" class="logo-expanded">
                    <!-- logo2x 是白字版（配深色侧栏），logo_dark 是深字版（配浅色侧栏），
                         由 nav.css 按 data-theme 切换显示，避免白字落在白底上看不见 -->
                    <img src="/static/img/logo_dark\@2x.png" width="100%" alt="AI 导航首页" class="nav-logo-on-light" />
                    <img src="/static/img/logo2x.png" width="100%" alt="" aria-hidden="true" class="nav-logo-on-dark" />
                </a>
                <a href="/" class="logo-collapsed">
                    <img src="/static/img/logo-collapsed2x.png" width="40" alt="AI 导航首页" />
                </a>
            </div>
            <div class="mobile-menu-toggle visible-xs">
                <a href="#" data-toggle="user-info-menu" aria-label="更多操作">
                    <i class="linecons-cog" aria-hidden="true"></i>
                </a>
                <a href="#" data-toggle="mobile-menu" aria-label="展开分类菜单">
                    <i class="fa-bars" aria-hidden="true"></i>
                </a>
            </div>
        </header>
        <ul id="main-menu" class="main-menu" role="navigation" aria-label="站点分类">
            @for(title in titles){
                @if(tool.isEmpty(title.children)){
                <li>
                    <a href="#${title.name}" class="smooth">
                        <i class="fa fa-fw ${title.icon}" aria-hidden="true"></i>
                        <span class="title">${title.name}</span>
                    </a>
                </li>
                @}else{
                <li>
                    <a>
                        <i class="fa fa-fw ${title.icon}" aria-hidden="true"></i>
                        <span class="title">${title.name}</span>
                    </a>
                    <ul>
                        @for(subTitle in title.children){
                        <li>
                            <a href="#${subTitle.name}" class="smooth">
                                <span class="title">${subTitle.name}</span>
                            </a>
                        </li>
                        @}
                    </ul>
                </li>
                @}
            @}

            <li class="submit-tag">
                <a href="/about">
                    <i class="linecons-heart" aria-hidden="true"></i>
                    <span class="tooltip-blue">关于本站</span>
                    <span class="label label-Primary pull-right hidden-collapsed">&hearts;</span>
                </a>
            </li>
        </ul>
    </div>
</div>

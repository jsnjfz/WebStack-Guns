server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8000}
  servlet:
    session:
      persistent: false
  compression:                    #开启响应压缩：app.css 799KB->78KB，app.js 303KB->95KB
    enabled: true
    mime-types: text/html,text/css,text/plain,text/xml,text/javascript,application/javascript,application/json,application/xml,image/svg+xml
    min-response-size: 1024

guns:
  swagger-open: ${GUNS_SWAGGER_OPEN:false}              #是否开启swagger (true/false)
  kaptcha-open: ${GUNS_KAPTCHA_OPEN:false}              #是否开启登录时验证码 (true/false)
  file-upload-path: ${GUNS_FILE_UPLOAD_PATH:}            #文件上传目录(不配置的话为java.io.tmpdir目录)
  spring-session-open: ${GUNS_SPRING_SESSION_OPEN:false} #是否开启spring session,如果是多机环境需要开启(true/false)
  secure-cookie: ${GUNS_SECURE_COOKIE}                   #本地 HTTP 显式设 false；HTTPS 部署设 true
  druid-monitor-open: ${GUNS_DRUID_MONITOR_OPEN:false}
  jwt-secret: ${GUNS_JWT_SECRET:}
  # 仅在数据库仍使用历史默认管理员密码时读取一次，完成轮换后应从环境中删除。
  bootstrap-admin-password: ${GUNS_BOOTSTRAP_ADMIN_PASSWORD:}
  session-invalidate-time: 1800     #session失效时间(只在单机环境下生效，多机环境在SpringSessionConfig类中配置) 单位：秒
  session-validation-interval: 900  #多久检测一次失效的session(只在单机环境下生效) 单位：秒

#静态资源版本号，随每次构建变化。前台模板以 ?v=… 附加在 css/js 上，
#使浏览器在发版后立即取到新文件，而不必等 Cache-Control 的 max-age 过期。
app:
  asset-version: @maven.build.timestamp@

beetl:
  resource-auto-check: ${BEETL_RESOURCE_AUTO_CHECK:false} #生产默认关闭；本地开发需要时显式开启

spring:
  main:
    allow-circular-references: true
  profiles:
    active: @spring.active@
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
    static-path-pattern: /static/**
    view:
      prefix: /WEB-INF/view
  devtools:
    restart:
      enabled: false
      additional-paths: src/main/java
      exclude: static/**,WEB-INF/view/**
  servlet:
    multipart:
      max-request-size: 5MB
      max-file-size: 5MB
  datasource:
    # 数据库连接信息必须由部署环境显式提供，禁止回退到 root/空密码。
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    filters: wall,mergeStat
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 1d           #静态资源浏览器缓存；资源名无内容哈希，故不宜设置过长

mybatis-plus:
  typeAliasesPackage: com.jsnjfz.manage.modular.system.model
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

log:
  path: manage-logs
